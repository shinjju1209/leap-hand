version: 1
description: >
  Template for LEAP Hand v1 per-motor open-pose calibration.
  Run leap_hand_motor_calibration.py to create calibration/hardware_motors.yaml
  from a physical open-hand pose. Confirm every sign with leap_hand_joint_test.py.
joints:
