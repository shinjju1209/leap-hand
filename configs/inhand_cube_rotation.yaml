# In-Hand Cube / Dice Rotation Policy Configuration Preset for LEAP Hand v1
task_name: "inhand_cube_rotation"

control:
  control_hz: 20.0             # Policy inference & control loop frequency (Hz)
  action_scale: 0.0416666667   # Official LEAP_Hand_Sim target integration scale (1/24 rad)
  ema_alpha: 0.8               # Action smoothing factor (1.0 = no filter, 0.2~0.8 = smooth)
  history_length: 3            # Number of observation steps to stack in history buffer
  target_axis: 1.0             # Default rotation direction (+1.0: counter-clockwise, -1.0: clockwise)

simulation:
  position_kp: 3.0             # Isaac Gym training controller stiffness
  velocity_kv: 0.1             # Isaac Gym training controller damping
  cube_drop_height: 0.08
  initial_cube_position: [-0.020763, 0.041853, 0.170797]
  initial_cube_quaternion_wxyz: [0.997554, 0.003869, 0.014019, -0.068372]

policy:
  checkpoint: "models/LeapHand.pth"

hardware:
  port: "/dev/ttyUSB0"
  current_limit_milliamps: 350 # Safe manipulation current limit (300~450 mA)
  # RL-only DYNAMIXEL gains. The tuned booth/teleop controller defaults remain
  # P=450, I=0, D=1200 with side_gain_scale=0.75.
  rl_position_p_gain: 800
  rl_position_i_gain: 0
  rl_position_d_gain: 200
  rl_side_gain_scale: 1.0
  max_joint_speed: 120.0       # Max joint velocity in degrees/second
  max_tracking_error: 25.0     # Max allowed tracking error in degrees before E-Stop
  tracking_warning: 8.0        # Report the first joint drifting from its policy target
  initial_pose_tolerance: 12.0 # Required error before policy activation (degrees)
  transition_seconds: 4.0      # Official deploy repeats the initial pose at 20 Hz for 4 s
  # Without cube support this physical joint stops near +8.3 deg, while the
  # exact policy grasp requests -8.6 deg. A transitions to the exact grasp
  # after the cube is placed.
  loading_pose_overrides_radians:
    middle_mcp_flex: 0.145

# Stable s=0.95 grasp from the official public LEAP Hand grasp cache, converted
# from Isaac Gym order into this project's ANGLE_NAMES order.
# Order: [index_mcp_side, index_mcp_flex, index_pip_flex, index_dip_flex,
#         middle_mcp_side, middle_mcp_flex, middle_pip_flex, middle_dip_flex,
#         ring_mcp_side, ring_mcp_flex, ring_pip_flex, ring_dip_flex,
#         thumb_cmc_side, thumb_cmc_flex, thumb_mcp_flex, thumb_ip_flex]
default_joint_pose_radians:
  - -1.047000  # index_mcp_side
  - 0.271074   # index_mcp_flex
  - 1.723322   # index_pip_flex
  - -0.185266  # index_dip_flex
  - 0.144084   # middle_mcp_side
  - -0.150765  # middle_mcp_flex
  - 1.806411   # middle_pip_flex
  - 0.118933   # middle_dip_flex
  - 0.988993   # ring_mcp_side
  - 0.114115   # ring_mcp_flex
  - 1.748292   # ring_pip_flex
  - -0.037210  # ring_dip_flex
  - 1.351773   # thumb_cmc_side
  - 1.480903   # thumb_cmc_flex
  - 0.962463   # thumb_mcp_flex
  - 0.980044   # thumb_ip_flex
